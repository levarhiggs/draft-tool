<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSBC SJV Summer 2026 Draft Tool</title>

  <!--
    This file is intentionally page-agnostic — it is ONLY a redirect to
    whichever page is the current "default" landing page for the app.

    TO CHANGE THE DEFAULT PAGE: edit the single DEFAULT_PAGE value below
    (both the <meta http-equiv="refresh"> content and the JS redirect must
    match) and push. That's the only edit needed — every other page's own
    filename/content/nav links are untouched by this.

    Current default: Playoffs (set 2026-09-07, during the Summer 2026
    playoffs). Past/likely-next defaults for reference:
      - schedules.html   — before a season starts / during the regular season
      - directory.html   — during tryouts/draft season
      - playoffs.html     — during playoffs (current)
      - standings.html    — end of regular season, before playoffs
    Pick whichever page is most relevant to what's happening right now.
  -->
  <meta http-equiv="refresh" content="0; url=playoffs.html" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f1117" />
</head>
<body style="background:#0f1117; color:#e8eaf0; font-family:'Segoe UI',system-ui,sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0;">
  <script>
    // Primary redirect (meta-refresh above is the no-JS fallback — the two
    // must be kept in sync if this URL ever changes).
    window.location.replace('playoffs.html');
  </script>
  <p>Redirecting to the app… if nothing happens, <a href="playoffs.html" style="color:#4f8ef7;">click here</a>.</p>
</body>
</html>
