<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>CSBC 2026 SJV — Draft Results</title>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0c12;--surface:#13161f;--card:#1a1d2b;
  --border:#252840;--text:#e8eaf0;--muted:#6b7194;--radius:12px;
}
body{
  font-family:'Segoe UI',system-ui,sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;padding:32px 20px 60px;
}
h1{
  font-size:1.5rem;font-weight:800;
  letter-spacing:.06em;text-transform:uppercase;color:#fff;margin-bottom:6px;
}
.subtitle{
  font-size:.8rem;color:var(--muted);
  letter-spacing:.08em;text-transform:uppercase;margin-bottom:0;
}
.teams-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(340px,1fr));
  gap:24px;max-width:1400px;margin:0 auto;
}
.team-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden;
}
.team-header{
  display:flex;align-items:center;gap:14px;
  padding:14px 18px;border-bottom:1px solid var(--border);
}
.team-number{
  width:34px;height:34px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:.85rem;font-weight:800;flex-shrink:0;
}
.team-name{font-size:1rem;font-weight:700;line-height:1.2}
.player-list{display:grid;grid-template-columns:repeat(4,1fr);gap:0}
.player-tile{
  display:flex;flex-direction:column;align-items:center;
  padding:10px 6px;border-right:1px solid var(--border);
  border-bottom:1px solid var(--border);position:relative;
}
.player-tile:nth-child(4n){border-right:none}
/* .pick-badge, .player-id and .team-pick-count were dropped with the pick
   numbers, ids and player counts — this is the parent-facing roster, so it
   shows who is on a team and not how the draft got there. */
.player-photo{
  width:76px;height:76px;border-radius:22%;
  object-fit:cover;object-position:center 68%;
  background:var(--border);display:block;margin-bottom:6px;
  cursor:pointer;transition:transform .15s,box-shadow .15s;
}
.player-photo:hover{transform:scale(1.08);box-shadow:0 0 0 2px #fff4}
.player-photo-placeholder{
  width:76px;height:76px;border-radius:22%;
  background:var(--border);display:flex;align-items:center;
  justify-content:center;font-size:1.6rem;margin-bottom:6px;flex-shrink:0;
}
.player-name{font-size:.68rem;font-weight:600;text-align:center;line-height:1.25;color:var(--text);word-break:break-word}
/* lightbox */
#lightbox{
  display:none;position:fixed;inset:0;z-index:1000;
  background:rgba(0,0,0,0.88);
  align-items:center;justify-content:center;cursor:pointer;
}
#lightbox.open{display:flex}
#lightbox img{
  max-width:88vw;max-height:88vh;
  border-radius:12px;object-fit:contain;
  box-shadow:0 8px 48px rgba(0,0,0,0.7);
}
#lightbox-name{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,0.7);color:#fff;
  padding:8px 20px;border-radius:20px;
  font-size:.9rem;font-weight:600;pointer-events:none;white-space:nowrap;
}
.loading-msg{
  text-align:center;color:var(--muted);padding:60px 20px;font-size:.95rem;
}

/* ── Header + hamburger menu (matches index.html / rotations.html) ── */
.top-header{
  max-width:1400px;margin:0 auto 28px;padding:0 4px;
  display:flex;align-items:center;gap:14px;
}
.btn-menu-toggle{
  flex-shrink:0;width:36px;height:36px;background:transparent;
  border:1px solid var(--border);border-radius:8px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;transition:border-color .15s;
}
.btn-menu-toggle:hover{border-color:#4f8ef7}
.btn-menu-toggle span{
  display:block;width:18px;height:2px;background:var(--text);
  border-radius:2px;transition:transform .2s,opacity .2s;
}
.btn-menu-toggle[aria-expanded="true"] span:nth-child(1){transform:translateY(6px) rotate(45deg)}
.btn-menu-toggle[aria-expanded="true"] span:nth-child(2){opacity:0}
.btn-menu-toggle[aria-expanded="true"] span:nth-child(3){transform:translateY(-6px) rotate(-45deg)}

.top-header-titles{min-width:0;flex:1 1 auto}
.top-header-titles h1{
  font-size:1.4rem;margin-bottom:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

@media (max-width:640px){
  .top-header-titles h1{font-size:1rem}
}

.side-menu-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:300}
.side-menu-overlay.hidden{display:none}
.side-menu{
  position:fixed;top:0;left:0;height:100%;width:260px;max-width:80vw;
  background:var(--surface);border-right:1px solid var(--border);
  box-shadow:0 4px 24px rgba(0,0,0,.4);z-index:301;
  display:flex;flex-direction:column;transform:translateX(-100%);
  transition:transform .2s ease;
}
.side-menu.open{transform:translateX(0)}
.side-menu-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 18px;border-bottom:1px solid var(--border);
  font-weight:700;color:var(--text);
}
.btn-menu-close{
  background:transparent;border:none;color:var(--muted);
  font-size:1.1rem;cursor:pointer;padding:4px 8px;
}
.btn-menu-close:hover{color:var(--text)}
.side-menu-link{
  display:flex;align-items:center;gap:10px;padding:14px 18px;
  color:var(--text);text-decoration:none;font-size:.95rem;
  border-bottom:1px solid var(--border);
}
.side-menu-link:hover{background:var(--card)}
.side-menu-link.active{color:#4f8ef7;font-weight:600}

/* "To be announced" state — shown between seasons, before a draft is held */
.tba-panel{grid-column:1/-1;max-width:560px;margin:64px auto;padding:40px 32px;
  text-align:center;background:#171a23;border:1px solid #262b38;border-radius:16px}
.tba-icon{font-size:3rem;line-height:1;margin-bottom:14px;opacity:.85}
.tba-panel h2{margin:0 0 14px;font-size:1.45rem;color:#e8eaf0;font-weight:700}
.tba-panel p{margin:0 0 10px;color:#98a0b4;font-size:.97rem;line-height:1.55}
.tba-meanwhile{margin-top:18px !important;font-size:.92rem}
.tba-panel a{color:#4f8ef7;text-decoration:none;font-weight:600}
.tba-panel a:hover{text-decoration:underline}
@media(max-width:600px){.tba-panel{margin:36px 14px;padding:30px 20px}}

/* ── Media submit sheet ────────────────────────────────────────────────────
   This page deliberately does NOT load style.css (gotcha #11), so the sheet's
   styles cannot come from there. Rather than duplicating the whole block, the
   sheet's own --clr-* tokens are mapped onto this page's palette and only the
   rules the sheet actually uses are restated. Keep in sync with the
   "USER-SUBMITTED MEDIA" section of style.css. */
#media-sheet{
  --clr-bg:var(--bg);--clr-surface:var(--surface);--clr-card:var(--card);
  --clr-border:var(--border);--clr-text:var(--text);--clr-muted:var(--muted);
  --clr-accent:#4f8ef7;--clr-accent-dk:#3a72d8;
  --clr-danger:#e05c5c;--clr-success:#4ecf87;--clr-warning:#e0a75c;
  --shadow:0 4px 24px rgba(0,0,0,.5);
  position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:600;
  display:flex;align-items:center;justify-content:center;padding:20px;
}
#media-sheet.hidden{display:none}
#media-sheet .media-sheet{
  background:var(--clr-surface);border:1px solid var(--clr-border);
  border-radius:var(--radius);width:100%;max-width:400px;max-height:88vh;
  overflow-y:auto;box-shadow:var(--shadow);padding:18px;text-align:left;
}
#media-sheet .media-sheet-head{display:flex;gap:11px;align-items:center;margin-bottom:15px}
#media-sheet .media-sheet-ava{
  width:46px;height:46px;border-radius:22%;flex-shrink:0;
  background:linear-gradient(145deg,#2c3150,#22263a);
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:1rem;color:#fff;
}
#media-sheet .media-sheet-title{font-size:.98rem;font-weight:700;line-height:1.25}
#media-sheet .media-sheet-title .pid{color:var(--clr-accent);font-variant-numeric:tabular-nums}
#media-sheet .media-sheet-sub{font-size:.73rem;color:var(--clr-muted);margin-top:2px}
#media-sheet .media-sheet-x{
  margin-left:auto;align-self:flex-start;background:none;border:0;
  color:var(--clr-muted);font-size:1.4rem;line-height:1;cursor:pointer;padding:0 2px;
}
#media-sheet .media-review-note{
  display:flex;gap:9px;align-items:flex-start;background:rgba(224,167,92,.1);

#media-sheet .media-review-b{font-size:.71rem;color:#c9b892;margin-top:3px;line-height:1.4}

  color:var(--clr-muted);margin-bottom:7px;

#media-sheet .media-quota-row{display:flex;gap:8px;margin-bottom:15px}
#media-sheet .media-quota{

  border-radius:7px;padding:8px 10px;
}
#media-sheet .media-quota-k{
  font-size:.6rem;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--clr-muted);
}
#media-sheet .media-quota-v{font-size:.95rem;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
#media-sheet .media-quota-v .cap{color:var(--clr-muted);font-size:.78rem}
#media-sheet .media-quota.full .media-quota-v .used{color:var(--clr-warning)}
#media-sheet .media-quota-bar{height:3px;border-radius:99px;background:var(--clr-border);margin-top:6px;overflow:hidden}
#media-sheet .media-quota-bar i{display:block;height:100%;background:var(--clr-accent);border-radius:99px}
#media-sheet .media-quota.full .media-quota-bar i{background:var(--clr-warning)}
#media-sheet .media-quota-foot{font-size:.66rem;color:var(--clr-muted);margin:-6px 0 15px;line-height:1.4}
#media-sheet .media-pick-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#media-sheet .media-pick{
  background:var(--clr-card);border:1px solid var(--clr-border);border-radius:8px;
  padding:14px 10px;font:inherit;color:var(--clr-text);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;
}
#media-sheet .media-pick:hover{border-color:var(--clr-accent)}
#media-sheet .media-pick-ico{font-size:1.3rem;line-height:1}
#media-sheet .media-pick-lab{font-size:.78rem;font-weight:600}
#media-sheet .media-pick-hint{font-size:.63rem;color:var(--clr-muted)}
#media-sheet .media-chosen{
  display:flex;gap:10px;align-items:center;background:var(--clr-bg);
  border:1px solid var(--clr-border);border-radius:7px;padding:9px 10px;margin-bottom:4px;
}
#media-sheet .media-chosen-thumb{
  width:52px;height:52px;border-radius:6px;flex-shrink:0;object-fit:cover;
  background:var(--clr-card);display:flex;align-items:center;justify-content:center;font-size:1.1rem;
}
#media-sheet .media-chosen-meta{min-width:0;flex:1}
#media-sheet .media-chosen-name{font-size:.78rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#media-sheet .media-chosen-facts{font-size:.68rem;color:var(--clr-muted);margin-top:2px;font-variant-numeric:tabular-nums}
#media-sheet .media-field{margin-top:13px}
#media-sheet .media-field>label{
  display:block;font-size:.64rem;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--clr-muted);margin-bottom:5px;
}
#media-sheet .media-field input,#media-sheet .media-field textarea{
  width:100%;background:var(--clr-bg);border:1px solid var(--clr-border);
  color:var(--clr-text);border-radius:6px;padding:8px 10px;font:inherit;font-size:.82rem;
}
#media-sheet .media-field textarea{resize:vertical;min-height:54px}
#media-sheet .media-optional{color:#5d6478;font-weight:600;text-transform:none;font-size:.66rem}
#media-sheet .media-hint{font-size:.7rem;color:var(--clr-muted);margin:8px 0 0}
#media-sheet .media-reject{
  border-left:3px solid var(--clr-danger);background:rgba(224,92,92,.09);
  border-radius:0 6px 6px 0;padding:10px 12px;
}
#media-sheet .media-reject-t{font-size:.78rem;font-weight:700;color:#f0a4a4}
#media-sheet .media-reject-b{font-size:.72rem;color:#d9b3b3;margin-top:3px;line-height:1.45}
#media-sheet .media-err{
  font-size:.75rem;color:#f0a4a4;margin:10px 0 0;
  background:rgba(224,92,92,.09);border-radius:6px;padding:8px 10px;
}
#media-sheet .media-err[hidden]{display:none}
#media-sheet .media-prog{margin-top:15px}
#media-sheet .media-prog[hidden]{display:none}
#media-sheet .media-prog-top{display:flex;justify-content:space-between;font-size:.72rem;margin-bottom:6px}
#media-sheet .media-prog-pct{font-weight:700;font-variant-numeric:tabular-nums;color:var(--clr-accent)}
#media-sheet .media-prog-track{height:6px;background:var(--clr-border);border-radius:99px;overflow:hidden}
#media-sheet .media-prog-fill{height:100%;width:0;background:var(--clr-accent);border-radius:99px;transition:width .25s ease}
#media-sheet .media-actions{display:flex;gap:8px;margin-top:16px}
#media-sheet .btn{
  background:var(--clr-surface);color:var(--clr-text);border:1px solid var(--clr-border);
  border-radius:6px;padding:9px 14px;font:inherit;font-size:.78rem;font-weight:600;cursor:pointer;
}
#media-sheet .btn-primary{background:var(--clr-accent);border-color:var(--clr-accent);color:#fff;flex:1}
#media-sheet .btn:disabled{opacity:.5;cursor:not-allowed}
#media-sheet .media-done{text-align:center;padding:18px 8px 4px}
#media-sheet .media-done-ico{
  width:46px;height:46px;border-radius:50%;margin:0 auto 12px;
  background:rgba(78,207,135,.15);border:1px solid rgba(78,207,135,.4);
  display:flex;align-items:center;justify-content:center;font-size:1.25rem;color:var(--clr-success);
}
#media-sheet .media-done-t{font-size:.98rem;font-weight:700}
#media-sheet .media-done-b{font-size:.79rem;color:var(--clr-muted);margin-top:6px;line-height:1.5}
#media-sheet .media-done-b b{color:var(--clr-text)}
/* ── Long-press feedback ───────────────────────────────────────────────────
   Touch opens the submit sheet with a ~500ms press, not a double-tap: on a
   phone, double-tap is the browser's own zoom gesture, and it gives no
   feedback until it fires. A press can show progress — which is what makes an
   otherwise invisible trigger discoverable, since someone who presses and
   hesitates watches the ring fill and learns the gesture exists.

   -webkit-touch-callout is the iOS half of suppressing the native image menu;
   the contextmenu handler in media-submit.js is the other half, and on iOS
   neither works alone. Scoped to submit targets only, so every other image in
   the app keeps its normal press-and-hold behaviour. */
.media-submit-target {
  cursor: pointer;
  position: relative;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}

/* The ring. A conic-gradient sweep is one element and one animation — no SVG,
   no extra markup in six different render paths. */
.media-submit-target.media-pressing::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  z-index: 3;
  background: conic-gradient(rgba(79,142,247,0.55) var(--media-press-deg, 0deg),
                             rgba(0,0,0,0.28) 0deg);
  animation: media-press-fill 500ms linear forwards;
}

/* Animating a custom property needs @property for it to interpolate at all;
   without it the value jumps. Browsers that don't support @property fall back
   to the dimming overlay alone, which still reads as "something is happening."  */
@property --media-press-deg {
  syntax: '<angle>';
  initial-value: 0deg;
  inherits: false;
}

@keyframes media-press-fill {
  from { --media-press-deg: 0deg; }
  to   { --media-press-deg: 360deg; }
}

@media (prefers-reduced-motion: reduce) {
  .media-submit-target.media-pressing::after {
    animation: none;
    background: rgba(0,0,0,0.28);
  }
}
@media(max-width:480px){
  #media-sheet{padding:0;align-items:flex-end}
  #media-sheet .media-sheet{max-width:none;max-height:92vh;border-radius:var(--radius) var(--radius) 0 0;border-bottom:0}
}

const photoIndex = {};  // id -> { thumbUrl, fullUrl }

async function buildPhotoIndex() {
  const cached = sessionStorage.getItem('drivePhotos_26.3');
  if (cached) {
    Object.assign(photoIndex, JSON.parse(cached));
    return;
  }
  const url = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(`'${PHOTOS_FOLDER_ID}' in parents`)}&fields=files(id,name)&key=${DRIVE_API_KEY}`;
  const res = await fetch(url);
  if (!res.ok) return;
  const data = await res.json();
  (data.files || []).forEach(({ id, name }) => {
    const pid = name.replace(/\.[^/.]+$/, '').trim();
    photoIndex[pid] = {
      thumbUrl: `https://drive.google.com/thumbnail?id=${id}&sz=w400`,
      fullUrl:  `https://drive.google.com/thumbnail?id=${id}&sz=w1200`,
    };
  });
  sessionStorage.setItem('drivePhotos_26.3', JSON.stringify(photoIndex));
}

/**
 * This page is what coaches share with parents, so it shows the roster and
 * nothing about how the roster came to be: no player ids, no pick numbers,
 * no seed order. Those are internal draft mechanics and live on the draft
 * board instead. Players are listed alphabetically by first name, which is
 * how a parent scans for their kid.
 */
function renderTeam(t) {
  const roster = t.players.slice().sort((a, b) =>
    a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }));

  const tiles = roster.map(p => {
    const entry = photoIndex[p.id];
    const photoHtml = entry
      ? `<img class="player-photo"
              src="${entry.thumbUrl}"
              alt="${p.name}"
              onclick="openLightbox('${entry.fullUrl}','${p.name.replace(/'/g, "\\'")}',event)"
              onerror="this.outerHTML='<div class=\\'player-photo-placeholder\\'>🏀</div>'" />`
      : `<div class="player-photo-placeholder">🏀</div>`;
    return `
      <div class="player-tile" data-player-id="${p.id}" data-player-name="${p.name.replace(/"/g, '&quot;')}">
        ${photoHtml}
        <div class="player-name">${p.name}</div>
      </div>`;
  }).join('');

  const textColor = readableTextColor(t.color);
  return `
    <div class="team-card">
      <div class="team-header">
        <div class="team-number" style="background:${t.color};color:${textColor};border:1.5px solid var(--border)">${t.num}</div>
        <div class="team-name">${t.coach} — Team ${t.colorName}</div>
      </div>
      <div class="player-list">${tiles}</div>
    </div>`;
}

// Same luminance-based contrast pick used by gameboard.js/playoffs.js — this
// page is a standalone (non-module) script, per gotcha #11, so it keeps its
// own copy rather than importing across script types.
function readableTextColor(hex) {
  const h = String(hex).replace('#', '');
  if (h.length !== 6) return '#ffffff';
  const r = parseInt(h.slice(0, 2), 16);
  const g = parseInt(h.slice(2, 4), 16);
  const b = parseInt(h.slice(4, 6), 16);
  const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
  return luminance > 0.6 ? '#000000' : '#ffffff';
}

async function init() {
  await buildPhotoIndex();
  document.getElementById('teams-grid').innerHTML = TEAMS.map(renderTeam).join('');
  // This page's script is NOT a module (it predates the rest of the app), so
  // it can't import media-submit.js itself. It signals instead, and the small
  // module script at the bottom of the file does the wiring.
  document.dispatchEvent(new CustomEvent('rosterRendered'));
}

}
document.getElementById('lightbox').addEventListener('click', () => {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
});

<!-- Media submit. A separate module because the main script above is a plain
     (non-module) script and cannot import. -->
<script type="module">
  import { attachMediaSubmit } from './media-submit.js';
  // Wire whatever is already on the page, then again on each render.
  //
  // Listening for the event ALONE is a race that loses on a warm cache: when
  // buildPhotoIndex() hits its sessionStorage cache it returns without ever
  // awaiting the network, so init() finishes — and fires rosterRendered —
  // before this module script has even been evaluated. The listener registers
  // too late, the event is long gone, and nothing gets wired. Verified: 88
  // tiles wired on a cold load, 0 on the very next visit. Running once
  // immediately covers that case; the listener covers the cold one.
  function wireAll() {
    document.querySelectorAll('.player-tile[data-player-id]').forEach(tile => {
      // Attach to the TILE, not the <img>. Each photo carries an inline
      // onerror that does `this.outerHTML = '<div class=player-photo-placeholder>'`
      // — which REPLACES the element, silently discarding any listener bound
      // to it. Every player whose Drive photo fails to load would lose the
      // double-tap (verified: only 3 of 88 tiles stayed wired when attaching
      // to the img). The tile wrapper is stable, so it keeps working whether
      // the photo loads, fails, or was never there.
      attachMediaSubmit(tile, {
        id:   tile.dataset.playerId,
        name: tile.dataset.playerName,
      });
    });
  }
  document.addEventListener('rosterRendered', wireAll);
  wireAll();
</script>
